    install_dir: "themes"
    tweak_variants:
      - ["soft"]
    ask_border: true
    border_tweak: "outline"
    ask_buttons: true
    buttons_tweak: "macos"

  - name: "Rose Pine"
    dir_pattern: "rose-pine*"
    repo_url: "https://github.com/rose-pine/gtk.git"
    copy_sub_dir: "gtk3"
    flatpak_name: "rose-pine-gtk"

  - name: "Gruvbox"
