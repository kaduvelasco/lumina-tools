  - name: "Graphite"
    dir_pattern: "Graphite-Dark"
    repo_url: "https://github.com/vinceliuice/Graphite-gtk-theme.git"
    install_args: ["-t", "default"]
    tweak_variants:
      - []
      - ["nord"]
    ask_border: true
    border_tweak: "rimless"

  - name: "Zorin"
    dir_pattern: "Zorin*"
    repo_url: "https://github.com/ZorinOS/zorin-desktop-themes.git"
    copy_sub_dir: "."
