# GNOME GTK Theme Catalogue — Lumina Tools
#
# Fields:
#   name:           Display name shown in the menu
#   dir_pattern:    Glob for detection. Absolute path = system-wide; relative = under ~/.themes/
#   repo_url:       Git repository URL
#   clone_target:   Clone the entire repo as ~/.themes/<clone_target>
#   copy_sub_dir:   Clone to tmp, copy each subdir from this path to ~/.themes/
#   install_dir:    Subdir containing install.sh; empty = repo root
#   install_args:   Args passed to ./install.sh (base; always applied)
#   tweak_variants: List of tweak sets; one install.sh run per entry (combined with user choices)
#   fixed_tweaks:   Tweaks always applied regardless of user choices
#   ask_border:     Prompt user for border style; value applied = border_tweak
#   border_tweak:   "rimless" (Graphite: default=border, alt=rimless) or "outline" (Fausto: default=borderless, alt=outline)
#   ask_buttons:    Prompt user for macOS-style buttons; value applied = buttons_tweak
#   buttons_tweak:  Tweak value for macOS buttons (usually "macos")
#   flatpak_name:   Legacy single-name flatpak override (kept for backward compat)
#   custom_script:  Run as root via "bash -c" instead of clone-based flows
#   purge_packages: Remove via apt-get purge instead of glob deletion

themes:
  - name: "Orchis"
    dir_pattern: "Orchis*"
    repo_url: "https://github.com/vinceliuice/Orchis-theme.git"
    install_args: ["-t", "all"]
    flatpak_name: "Orchis"

  - name: "Nordic"
    dir_pattern: "Nordic"
    repo_url: "https://github.com/EliverLara/Nordic.git"
    clone_target: "Nordic"
    flatpak_name: "Nordic"

  - name: "Colloid"
    dir_pattern: "Colloid*"
    repo_url: "https://github.com/vinceliuice/Colloid-gtk-theme.git"
    install_args: ["-t", "all"]
    flatpak_name: "Colloid"

  - name: "Fluent"
    dir_pattern: "Fluent*"
    repo_url: "https://github.com/vinceliuice/Fluent-gtk-theme.git"
    install_args: ["-t", "all"]
    flatpak_name: "Fluent"

  - name: "Tokyonight"
    dir_pattern: "Tokyonight*"
    repo_url: "https://github.com/Fausto-Korpsvart/Tokyonight-GTK-Theme.git"
    install_dir: "themes"
    flatpak_name: "Tokyonight-Dark"

  - name: "Everforest (Hard)"
    dir_pattern: "Everforest-Dark"
    repo_url: "https://github.com/Fausto-Korpsvart/Everforest-GTK-Theme.git"
    install_dir: "themes"
    ask_border: true
    border_tweak: "outline"
    ask_buttons: true
    buttons_tweak: "macos"

  - name: "Everforest (Medium)"
    dir_pattern: "Everforest-Dark-Medium"
    repo_url: "https://github.com/Fausto-Korpsvart/Everforest-GTK-Theme.git"
    install_dir: "themes"
    tweak_variants:
      - ["medium"]
    ask_border: true
    border_tweak: "outline"
    ask_buttons: true
    buttons_tweak: "macos"

  - name: "Everforest (Soft)"
    dir_pattern: "Everforest-Dark-Soft"
