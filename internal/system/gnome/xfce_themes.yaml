# XFCE Theme Catalogue — Lumina Tools
#
# Same fields as gnome_themes.yaml / cinnamon_themes.yaml, plus:
#   extra_dir_patterns: additional glob patterns removed on uninstall, for
#                        entries that install several unrelated-looking
#                        folders at once (a single glob can't cover them all).
#   user_script:         runs as the current user (no sudo), for entries that
#                         need more than clone/copy/install.sh (e.g. download
#                         a release tarball and merge in a companion repo).
#
# Researched from each upstream repo's actual file tree before being added
# here — see CHANGELOG.md for the install mechanism notes per theme.

themes:
  - name: "XFWM4 Theme Collection"
    dir_pattern: "Chandelier"
    extra_dir_patterns:
      ["2bxfwm-*", "A#m7", "C#m7", "C#m7b5", "Circela", "Frontiere-*", "Lumiere-Magenta", "Nelio*", "Pita", "Rin", "Strawberry-Float", "Xfwm-Gaps"]
    repo_url: "https://github.com/addy-dclxvi/xfwm4-theme-collections.git"
    copy_sub_dir: "."

  - name: "Lavanda (Light)"
    dir_pattern: "Lavanda-Light"
    repo_url: "https://github.com/vinceliuice/Lavanda-gtk-theme.git"
    install_args: ["-c", "light"]

  - name: "Lavanda (Dark)"
    dir_pattern: "Lavanda-Dark"
    repo_url: "https://github.com/vinceliuice/Lavanda-gtk-theme.git"
    install_args: ["-c", "dark"]

  - name: "Graphite"
    dir_pattern: "Graphite-Dark"
    repo_url: "https://github.com/vinceliuice/Graphite-gtk-theme.git"
    install_args: ["-t", "default"]
    tweak_variants:
      - []
      - ["nord"]
    fixed_tweaks: ["normal"]
    ask_border: true
    border_tweak: "rimless"

  - name: "POP"
    dir_pattern: "Pop-Xfwm*"
    extra_dir_patterns: ["Pop-light-Xfwm*"]
    repo_url: "https://gitlab.com/spass/pop-xfwm-theme.git"
    copy_sub_dir: "."

  - name: "Orchis (Light)"
    dir_pattern: "Orchis-Light"
    repo_url: "https://github.com/vinceliuice/Orchis-theme.git"
    install_args: ["-c", "light"]

  - name: "Orchis (Dark)"
    dir_pattern: "Orchis-Dark"
    repo_url: "https://github.com/vinceliuice/Orchis-theme.git"
    install_args: ["-c", "dark"]

  - name: "Layan (Light)"
    dir_pattern: "Layan-Light"
    repo_url: "https://github.com/vinceliuice/Layan-gtk-theme.git"
    install_args: ["-c", "light"]

  - name: "Layan (Dark)"
    dir_pattern: "Layan-Dark"
    repo_url: "https://github.com/vinceliuice/Layan-gtk-theme.git"
    install_args: ["-c", "dark"]

  - name: "WhiteSur"
    dir_pattern: "WhiteSur-*"
    repo_url: "https://github.com/CoolAller/WhiteSur-gtk-theme-cinnamon-xfce.git"
    copy_sub_dir: "."

  - name: "ADW-GTK3"
    dir_pattern: "adw-gtk3*"
    user_script: |
      set -e
      TD="$1"
      TMP=$(mktemp -d)
      trap 'rm -rf -- "$TMP"' EXIT
      TAG=$(curl -fsSL https://api.github.com/repos/lassekongo83/adw-gtk3/releases/latest | grep -m1 '"tag_name"' | cut -d'"' -f4)
      curl -fsSL -o "$TMP/adw-gtk3.tar.xz" "https://github.com/lassekongo83/adw-gtk3/releases/download/$TAG/adw-gtk3$TAG.tar.xz"
      tar -xJf "$TMP/adw-gtk3.tar.xz" -C "$TMP"
      rm -rf -- "$TD/adw-gtk3" "$TD/adw-gtk3-dark"
      cp -r -- "$TMP/adw-gtk3" "$TMP/adw-gtk3-dark" "$TD/"
      git clone --depth=1 -- "https://github.com/FabianOvrWrt/adw-xfwm4.git" "$TMP/adw-xfwm4"
      for variant in adw-gtk3 adw-gtk3-dark; do
        if [ -d "$TMP/adw-xfwm4/themes/$variant/xfwm4" ]; then
          rm -rf -- "$TD/$variant/xfwm4"
          cp -r -- "$TMP/adw-xfwm4/themes/$variant/xfwm4" "$TD/$variant/"
        fi
      done
