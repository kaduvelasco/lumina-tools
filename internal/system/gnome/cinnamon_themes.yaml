# Cinnamon GTK Theme Catalogue — Lumina Tools
#
# Same fields as gnome_themes.yaml.
# fixed_tweaks: tweaks always applied (e.g. "normal" = Nautilus sidebar with coloured icons).

themes:
  - name: "Graphite"
    dir_pattern: "Graphite-Dark"
    repo_url: "https://github.com/vinceliuice/Graphite-gtk-theme.git"
    install_args: ["-t", "default"]
    tweak_variants:
      - []
      - ["nord"]
    fixed_tweaks: ["normal"]
    ask_border: true
    border_tweak: "rimless"

  - name: "Catppuccin (Mocha)"
    dir_pattern: "Catppuccin-Dark"
    repo_url: "https://github.com/Fausto-Korpsvart/Catppuccin-GTK-Theme.git"
    install_dir: "themes"
    install_args: ["-m", "dark"]
    ask_border: true
    border_tweak: "border"
    ask_buttons: true
    buttons_tweak: "macos"

  - name: "Catppuccin (Latte)"
    dir_pattern: "Catppuccin-Light"
    repo_url: "https://github.com/Fausto-Korpsvart/Catppuccin-GTK-Theme.git"
    install_dir: "themes"
    install_args: ["-m", "light"]
    ask_border: true
    border_tweak: "border"
    ask_buttons: true
    buttons_tweak: "macos"

  - name: "Catppuccin (Frappé)"
    dir_pattern: "Catppuccin-Frapp*"
    repo_url: "https://github.com/Fausto-Korpsvart/Catppuccin-GTK-Theme.git"
    install_dir: "themes"
    install_args: ["-m", "dark"]
